<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="ShopNGo - browse the latest arrivals in clothing, footwear and accessories."
    />
    <title>ShopNGo</title>
    <!-- The API is on another origin, so the browser has a DNS lookup and a
         TLS handshake to do before the first request. Starting them here
         overlaps that with downloading the bundle. -->
    <link rel="preconnect" href="https://shopngo-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://shopngo-api.onrender.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
